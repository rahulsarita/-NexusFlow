version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: nexusflow
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Express Server (Replicated)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    expose:
      - "5000"
    deploy:
      replicas: 2
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/nexusflow
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy

  # Frontend React Client + Nginx Reverse Proxy / Load Balancer
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data:
