version: '3.8'

services:
  # Node 1
  mongo1:
    image: mongo:7.0
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo1_data:/data/db
    ports:
      - "27017:27017"

  # Node 2
  mongo2:
    image: mongo:7.0
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo2_data:/data/db
    ports:
      - "27018:27017"

  # Node 3
  mongo3:
    image: mongo:7.0
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo3_data:/data/db
    ports:
      - "27019:27017"

  # Replica Set Initializer
  mongo-init:
    image: mongo:7.0
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        sleep 5
        mongosh --host mongo1:27017 --eval '
        try {
          rs.status();
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo1:27017", priority: 2 },
              { _id: 1, host: "mongo2:27017", priority: 1 },
              { _id: 2, host: "mongo3:27017", priority: 1 }
            ]
          });
        }
        '

  # Backend Server (Replicas)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    expose:
      - "5000"
    deploy:
      replicas: 2
    environment:
      - MONGODB_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/nexusflow?replicaSet=rs0
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      - mongo-init

  # Frontend Client & Proxy
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
